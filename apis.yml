aid: kasa
name: Kasa
description: 'Kasa is a tech-enabled hospitality company operating a curated collection of furnished
  apartments and boutique hotels across dozens of U.S. cities. Its asset-light model partners with
  multifamily property owners and hotel operators to run flexible short-term, extended-stay, and
  corporate accommodations, layering a proprietary technology platform on top for contactless
  check-in, a virtual front desk, remote guest support, and unit operations. Kasa also serves
  corporate housing and corporate travel programs. Backed by Ribbit Capital, the company is
  tracked in the API Evangelist network as a proptech/hospitality provider; as of this profile it
  publishes no public developer API, SDK, or documentation surface.'
